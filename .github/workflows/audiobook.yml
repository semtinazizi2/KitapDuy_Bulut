name: Sesli Kitap Fabrikasi

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Kitap ID'si (Örn: 74 veya 'auto')"
        required: true
        default: "auto"

jobs:
  build_audiobook:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max
    
    steps:
      - name: Kodlari Cek (Checkout)
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri (FFMPEG) Kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python Kutuphanelerini Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Onceki Uretimleri İndir (Hafiza)
        uses: actions/cache@v3
        with:
          path: output_audio/
          key: audio-cache-${{ github.run_id }}
          restore-keys: |
            audio-cache-

      - name: Firebase Anahtarini Olustur
        run: |
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > serviceAccountKey.json

      - name: Sesli Kitap Uretimini Baslat
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          BOOK_SOURCE: ${{ github.event.inputs.book_id }}
          BOOK_MODE: "full"
        run: |
          python main.py
